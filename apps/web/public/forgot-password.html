<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Odzyskaj dostęp — BuildSmart AI</title>
  <style>
    body{margin:0;background:#f6f7f9;color:#172033;font-family:Arial,sans-serif}.box{width:min(430px,calc(100% - 40px));margin:10vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 1px 2px #10182820}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;font:inherit;border-radius:8px;border:1px solid #d0d5dd}button{background:#101828;color:#fff;border:0;font-weight:700;cursor:pointer}.hint{color:#667085;line-height:1.5}.message{min-height:20px;color:#b42318}.back{color:#175cd3;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="box">
    <a class="back" href="/">← Wróć do logowania</a>
    <h1>Odzyskaj dostęp</h1>
    <p class="hint">Podaj adres e-mail. Jeżeli konto istnieje, wyślemy link do ustawienia nowego hasła.</p>
    <form id="form"><input name="email" type="email" autocomplete="email" placeholder="Adres e-mail" required><button>Wyślij link</button><p id="message" class="message"></p></form>
  </main>
  <script>
    const message=document.querySelector('#message');
    document.querySelector('#form').onsubmit=async event=>{event.preventDefault();message.textContent='';const email=new FormData(event.currentTarget).get('email');try{const response=await fetch('/api/v1/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});if(!response.ok)throw Error('Nie udało się wysłać prośby. Spróbuj ponownie później.');message.style.color='#067647';message.textContent='Jeżeli konto istnieje, link został wysłany.'}catch(error){message.textContent=error.message}};
  </script>
</body>
</html>

<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ustaw nowe hasło — BuildSmart AI</title><style>body{margin:0;background:#f6f7f9;font-family:Arial;color:#172033}.box{width:min(430px,calc(100% - 40px));margin:10vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 1px 2px #10182820}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;font:inherit;border-radius:8px;border:1px solid #d0d5dd}button{background:#101828;color:#fff;border:0;font-weight:700;cursor:pointer}.hint{color:#667085;line-height:1.5}.error{color:#b42318;min-height:20px}</style></head><body><main class="box"><h1>Ustaw nowe hasło</h1><p class="hint">Hasło musi mieć co najmniej 10 znaków. Po zmianie zostaniesz wylogowany na innych urządzeniach.</p><form id="form"><input name="password" type="password" minlength="10" placeholder="Nowe hasło" required><input name="repeat" type="password" minlength="10" placeholder="Powtórz nowe hasło" required><button>Zapisz nowe hasło</button><p id="message" class="error"></p></form></main><script>const token=new URLSearchParams(location.search).get('token');const message=document.querySelector('#message');document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const form=new FormData(event.currentTarget);if(!token){message.textContent='Brakuje lub wygasł link do zmiany hasła.';return}if(form.get('password')!==form.get('repeat')){message.textContent='Hasła nie są takie same.';return}try{const response=await fetch('/api/v1/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:form.get('password')})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.detail||'Nie udało się zmienić hasła.')}message.style.color='#067647';message.textContent='Hasło zostało zmienione. Za chwilę przejdziesz do logowania.';setTimeout(()=>location.assign('/'),1500)}catch(error){message.textContent=error.message}};</script></body></html>
